    return `<section class="pagina"><div class="pagina-conteudo">${cabecalho(a)}

        <tbody>${linhas}${vazias}${vazias}

        </tbody>

      <table class="res">

      <div class="emissao">${esc(a.cidade_emissao || "Manaus")}, ${dataExtenso(a.data_emissao)}.</div>
      <div class="assin"><div>Secretário(a)</div><div>Diretor(a)</div></div>
    </div></section>`;
  };

  const html = alunos => alunos.map(a => pagina1(a) + pagina2(a)).join("");
  const render = (alunos, el = document.getElementById("historicos")) => {
    el.innerHTML = html(alunos);
  };
  return { render, html };
})();

const HistoricoEscolarDados = (() => {
  const campo = (obj, ...nomes) => nomes.map(nome => obj?.[nome]).find(valor => valor !== null && valor !== undefined && valor !== "") ?? "";
  const normalizar = valor => String(valor || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
  const serie = valor => Number(String(valor || "").match(/[123]/)?.[0]);
  const pertence = (disciplina, numero) => (Array.isArray(disciplina.series) ? disciplina.series : String(disciplina.series || "").split(",")).some(item => serie(item) === numero);
  const mediaTecnica = registros => {
    const coluna = "nota_final_periodo";
    const notas = registros.map(registro => Number(registro[coluna])).filter(Number.isFinite);
    return notas.length ? (notas.reduce((total, nota) => total + nota, 0) / notas.length).toFixed(1) : null;
  };

  async function carregar(ra, anoConclusao) {
    const ano3 = Number(anoConclusao || new Date().getFullYear());
    const cliente = window.supabaseClient;
    if (!cliente || !Number.isInteger(ano3)) throw new Error("Parâmetros do histórico inválidos.");
    const [alunoRes, dadosHistoricoRes, matriculasRes, disciplinasRes] = await Promise.all([
      cliente.from("alunos").select("*").eq("ra", ra).maybeSingle(),
      cliente.from("alunos_dados_historico").select("*").eq("ra", ra).maybeSingle(),
      cliente.from("matriculas").select("id, ano_letivo, status, turmas(*)").eq("ra_aluno", ra).gte("ano_letivo", ano3 - 2).lte("ano_letivo", ano3),
      cliente.from("disciplinas").select("*").order("nome")
    ]);
    for (const resposta of [alunoRes, dadosHistoricoRes, matriculasRes, disciplinasRes]) if (resposta.error) throw resposta.error;
    if (!alunoRes.data) throw new Error("Aluno não encontrado.");

    const porAno = new Map((matriculasRes.data || []).map(matricula => [Number(matricula.ano_letivo), matricula]));
    const ids = [...porAno.values()].map(matricula => matricula.id).filter(Boolean);
    const [anualBasica, tecnica] = ids.length ? await Promise.all([
      cliente.from("anual_basica").select("id_matricula, sigla_disciplina, media_final").in("id_matricula", ids),
      cliente.from("notas_tecnica").select("*").in("id_matricula", ids)
    ]) : [{ data: [] }, { data: [] }];
    for (const resposta of [anualBasica, tecnica]) if (resposta.error) throw resposta.error;

    const turma3 = porAno.get(ano3)?.turmas || {};
    const area = campo(turma3, "area_tecnica", "curso_tecnico", "curso");
    const areaNormalizada = normalizar(area);
    const areaCanonica = {
      INFORMATICA: "INFORMÁTICA",
      MECATRONICA: "MECATRÔNICA"
    }[areaNormalizada] || String(area || "").trim().toLocaleUpperCase("pt-BR");
    const disciplinaDeOutraArea = disciplina => {
      const nomeNormalizado = normalizar(disciplina.nome || disciplina.sigla).trim();
      const disciplinaCarreira = "PLANEJAMENTO DE CARREIRA E PROCESSO SELETIVO";
      if (nomeNormalizado === `${disciplinaCarreira} (I)`) return areaNormalizada !== "INFORMATICA";
      if (nomeNormalizado === `${disciplinaCarreira} (M)`) return areaNormalizada !== "MECATRONICA";
      return false;
    };
    const notas = new Map();
    (tecnica.data || []).forEach(registro => {
      const chave = `${registro.id_matricula}:${registro.sigla_disciplina}`;
      notas.set(chave, [...(notas.get(chave) || []), registro]);
    });
    const finaisBasicas = new Map((anualBasica.data || []).map(registro => [`${registro.id_matricula}:${registro.sigla_disciplina}`, registro.media_final]));
    const disciplinas = (disciplinasRes.data || [])
      .filter(disciplina => {
        const areaDisciplina = campo(disciplina, "area_tecnica", "curso_tecnico", "curso");
        return !disciplinaDeOutraArea(disciplina) &&
          (!areaDisciplina || !areaNormalizada || normalizar(areaDisciplina) === areaNormalizada);
      })
      .filter(disciplina => {
        if (normalizar(disciplina.tipo) !== "TEC") return true;
        return [...porAno.values()].some(matricula => notas.has(`${matricula.id}:${disciplina.sigla}`));
      })
      .filter(disciplina => [1, 2, 3].some(numero => pertence(disciplina, numero)))
      .map(disciplina => ({
        nome: disciplina.nome || disciplina.sigla,
        notas: [0, 1, 2].map(indice => {
          const matricula = porAno.get(ano3 - 2 + indice);
          if (!matricula || !pertence(disciplina, indice + 1)) return null;
          const chave = `${matricula.id}:${disciplina.sigla}`;
          return normalizar(disciplina.tipo) === "TEC" ? mediaTecnica(notas.get(chave) || []) : finaisBasicas.get(chave) ?? null;
        }),
        chs: [0, 1, 2].map(indice => porAno.has(ano3 - 2 + indice) && pertence(disciplina, indice + 1) ? disciplina.carga_horaria : null)
      }));
    const resultado = status => normalizar(status).includes("TRANSFER") ? "TRANSFERIDO" : normalizar(status).includes("REPROV") ? "REPROVADO" : "APROVADO";
    return {
      nome: campo(alunoRes.data, "nome_completo", "nome"),
      cpf: campo(dadosHistoricoRes.data, "cpf", "cpf_aluno") || campo(alunoRes.data, "cpf", "cpf_aluno"),
      data_nascimento: campo(dadosHistoricoRes.data, "data_nascimento"),
      nacionalidade: campo(dadosHistoricoRes.data, "nacionalidade"), naturalidade: campo(dadosHistoricoRes.data, "naturalidade"),
      estado_natal: campo(dadosHistoricoRes.data, "estado_natal"), curso_anterior: campo(dadosHistoricoRes.data, "curso_anterior"),
      ano_conclusao: campo(dadosHistoricoRes.data, "ano_conclusao_anterior"), instituicao_origem: campo(dadosHistoricoRes.data, "instituicao_origem"),
      instituicao_origem_cidade: campo(dadosHistoricoRes.data, "instituicao_origem_cidade"), instituicao_origem_uf: campo(dadosHistoricoRes.data, "instituicao_origem_uf"),
      disciplinas,
      resultados: [0, 1, 2].map(indice => ({ ano: ano3 - 2 + indice, serie: `${indice + 1}ª Série`, estabelecimento: INSTITUICAO.nome, cidade: "MANAUS", uf: "AM", resultado: resultado(porAno.get(ano3 - 2 + indice)?.status) })),
      perfil: { titulo: `TÉCNICO EM ${areaCanonica || "-"}`, texto: PERFIS_TECNICOS[areaCanonica] || "Perfil profissional não configurado para este curso técnico." },
      cidade_emissao: "Manaus", data_emissao: new Date().toISOString().slice(0, 10)
    };
  }
  return { carregar };
})();

function mostrarVisualizadorPdf(pdfUrl, nomeArquivo) {
  document.title = nomeArquivo;
  const barra = document.createElement("header");
  barra.className = "pdf-preview-toolbar";
  const baixar = document.createElement("a");
  baixar.href = pdfUrl;
  baixar.download = nomeArquivo;
  baixar.textContent = "Baixar PDF";
  barra.append(baixar);

  const paginas = document.createElement("main");
  paginas.className = "pdf-preview-pages";

  document.body.classList.add("pdf-preview-open");
  document.body.replaceChildren(barra, paginas);

  if (!window.pdfjsLib) throw new Error("A biblioteca de visualização do PDF não foi carregada.");
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  return window.pdfjsLib.getDocument(pdfUrl).promise.then(async documento => {
    const escalaDensidade = Math.min(window.devicePixelRatio || 1, 1.5);
    const primeiraPagina = await documento.getPage(1);
    const escalaInicial = Math.min(1, (window.innerWidth - 40) / primeiraPagina.getViewport({ scale: 1 }).width);
    const viewportInicial = primeiraPagina.getViewport({ scale: escalaInicial });
    const nodes = [];
    for (let numero = 1; numero <= documento.numPages; numero++) {
      const placeholder = document.createElement("div");
      placeholder.className = "pdf-preview-page";
      placeholder.style.width = `${viewportInicial.width}px`;
      placeholder.style.height = `${viewportInicial.height}px`;
      placeholder.dataset.pageNumber = String(numero);
      paginas.append(placeholder);
      nodes.push(placeholder);
    }

    const pending = [];
    let rendering = false;
    const renderNext = async () => {
      if (rendering) return;
      rendering = true;
      while (pending.length) {
        const node = pending.shift();
        if (node.dataset.visible !== "true" || node.dataset.rendered === "true" || node.dataset.rendering === "true") continue;
        node.dataset.rendering = "true";
        const pagina = await documento.getPage(Number(node.dataset.pageNumber));
        const escala = Math.min(1, (window.innerWidth - 40) / pagina.getViewport({ scale: 1 }).width);
        const viewport = pagina.getViewport({ scale: escala });
        const canvas = document.createElement("canvas");
        canvas.width = Math.ceil(viewport.width * escalaDensidade);
        canvas.height = Math.ceil(viewport.height * escalaDensidade);
        canvas.style.width = `${viewport.width}px`;
        canvas.style.height = `${viewport.height}px`;
        await pagina.render({
          canvasContext: canvas.getContext("2d"),
          viewport: pagina.getViewport({ scale: escala * escalaDensidade })
        }).promise;
        if (node.dataset.visible === "true") {
          node.replaceChildren(canvas);
          node.dataset.rendered = "true";
        } else {
          canvas.width = 0;
          canvas.height = 0;
        }
        node.dataset.rendering = "false";
      }
      rendering = false;
    };

    const observar = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const node = entry.target;
        node.dataset.visible = String(entry.isIntersecting);
        if (entry.isIntersecting) {
          if (node.dataset.rendered !== "true" && node.dataset.rendering !== "true") pending.push(node);
        } else if (node.dataset.rendered === "true") {
          const canvas = node.querySelector("canvas");
          if (canvas) {
            canvas.width = 0;
            canvas.height = 0;
          }
          node.replaceChildren();
          node.dataset.rendered = "false";
        }
      });
      renderNext().catch(erro => {
        console.error("Erro ao renderizar página do PDF:", erro);
        const mensagem = document.createElement("p");
        mensagem.className = "pdf-preview-error";
        mensagem.textContent = `Não foi possível renderizar a página: ${erro.message}`;
        paginas.prepend(mensagem);
      });
    }, { root: paginas, rootMargin: "400px 0px" });
    nodes.forEach(node => observar.observe(node));
  }).catch(erro => {
    const mensagem = document.createElement("p");
    mensagem.className = "pdf-preview-error";
    mensagem.textContent = `Não foi possível exibir a pré-visualização do PDF: ${erro.message}`;
    paginas.replaceChildren(mensagem);
    throw erro;
  });
}

function ajustarPaginaAoA4(pagina, escala) {
  const conteudo = pagina.querySelector(".pagina-conteudo");
  const tabelaNotas = pagina.querySelector(".notas");
  const tabelaResultados = pagina.querySelector(".res");

  if (tabelaNotas) {
    tabelaNotas.style.fontSize = `${7.5 * escala}pt`;
    tabelaNotas.querySelectorAll("td, th").forEach(celula => {
      celula.style.padding = `${0.45 * escala}mm 1.2mm`;
      celula.style.lineHeight = String(1.05 * escala);
      celula.style.fontSize = `${(celula.matches("th.nome") ? 8.5 : celula.matches("th") ? 8 : 7.5) * escala}pt`;
      if (celula.matches("td")) celula.style.height = `${3.9 * escala}mm`;
    });
  }

  if (tabelaResultados) {
    tabelaResultados.style.fontSize = `${7.5 * escala}pt`;
    tabelaResultados.querySelectorAll("td, th").forEach(celula => {
      celula.style.padding = `${escala}mm 1mm`;
      celula.style.lineHeight = String(1.05 * escala);
      celula.style.fontSize = `${7.5 * escala}pt`;
    });
  }

  const perfil = pagina.querySelector(".perfil");
  if (perfil) {
    perfil.style.minHeight = `${150 * escala}mm`;
    perfil.style.fontSize = `${7.5 * escala}pt`;
    perfil.style.lineHeight = String(1.25 * escala);
    const titulo = perfil.querySelector(".pt");
    if (titulo) {
      titulo.style.fontSize = `${7.5 * escala}pt`;
      titulo.style.padding = `${0.8 * escala}mm ${1.2 * escala}mm`;
    }
    const corpo = perfil.querySelector(".corpo");
    if (corpo) corpo.style.padding = `${0.8 * escala}mm ${1.2 * escala}mm`;
    const emissao = pagina.querySelector(".emissao");
    if (emissao) {
      emissao.style.fontSize = `${10 * escala}pt`;
      emissao.style.marginTop = `${14 * escala}mm`;
    }
    const assinaturas = pagina.querySelector(".assin");
    if (assinaturas) {
      assinaturas.style.fontSize = `${7.5 * escala}pt`;
      assinaturas.style.marginTop = `${38 * escala}mm`;
    }
  }

  return conteudo.scrollHeight;
}

function ajustarPaginasAoA4(documento) {
  const larguraUtilPx = 194 * 96 / 25.4;
  const alturaUtilPx = 280.8 * 96 / 25.4;

  documento.querySelectorAll(".pagina").forEach(pagina => {
    const conteudo = pagina.querySelector(".pagina-conteudo");
    let escalaMinima = 0.35;
    let escalaMaxima = 1;
    let escalaFinal = escalaMinima;

    if (conteudo.scrollWidth > larguraUtilPx || conteudo.scrollHeight > alturaUtilPx) {
      for (let tentativa = 0; tentativa < 18; tentativa++) {
        const escala = (escalaMinima + escalaMaxima) / 2;
        const altura = ajustarPaginaAoA4(pagina, escala);
        if (conteudo.scrollWidth <= larguraUtilPx && altura <= alturaUtilPx) {
          escalaFinal = escala;
          escalaMinima = escala;
        } else {
          escalaMaxima = escala;
        }
      }
      ajustarPaginaAoA4(pagina, escalaFinal);
    }
  });
}

function abrirArmazenamentoPdf() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open("fmm-historico-pdf", 1);
    request.onupgradeneeded = () => {
      if (!request.result.objectStoreNames.contains("arquivos")) {
        request.result.createObjectStore("arquivos");
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error("Não foi possível abrir o armazenamento temporário do PDF."));
  });
}

async function salvarPdfTemporario(token, blob, nomeArquivo) {
  const database = await abrirArmazenamentoPdf();
  await new Promise((resolve, reject) => {
    const transaction = database.transaction("arquivos", "readwrite");
    transaction.objectStore("arquivos").put({ blob, nomeArquivo }, token);
    transaction.oncomplete = resolve;
    transaction.onerror = () => reject(transaction.error || new Error("Não foi possível guardar o PDF temporariamente."));
    transaction.onabort = () => reject(transaction.error || new Error("O armazenamento temporário do PDF foi interrompido."));
  });
  database.close();
}

async function carregarPdfTemporario(token) {
  const database = await abrirArmazenamentoPdf();
  const registro = await new Promise((resolve, reject) => {
    const transaction = database.transaction("arquivos", "readonly");
    const request = transaction.objectStore("arquivos").get(token);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error("Não foi possível ler o PDF temporário."));
  });
  if (registro) {
    await new Promise((resolve, reject) => {
      const transaction = database.transaction("arquivos", "readwrite");
      transaction.objectStore("arquivos").delete(token);
      transaction.oncomplete = resolve;
      transaction.onerror = () => reject(transaction.error || new Error("Não foi possível remover o PDF temporário."));
    });
  }
  database.close();
  return registro;
}

async function iniciarHistorico() {
  const parametros = new URLSearchParams(location.search);
  const estado = document.getElementById("estado");
  const mensagemEstado = document.getElementById("estadoMensagem");
  const tokenPdfPronto = parametros.get("pdfReady");
  if (tokenPdfPronto) {
    try {
      const registro = await carregarPdfTemporario(tokenPdfPronto);
      if (!registro?.blob || !registro?.nomeArquivo) throw new Error("O arquivo PDF temporário não foi encontrado.");
      const pdfUrl = URL.createObjectURL(registro.blob);
      await mostrarVisualizadorPdf(pdfUrl, registro.nomeArquivo);
      localStorage.removeItem(`historico-pdf:${tokenPdfPronto}`);
    } catch (erro) {
      console.error("Erro ao abrir o PDF preparado:", erro);
      if (estado) {
        estado.classList.add("estado-erro");
        if (mensagemEstado) mensagemEstado.textContent = `Não foi possível abrir o PDF: ${erro.message}`;
        const voltar = document.createElement("a");
        voltar.className = "estado-voltar";
        voltar.href = "historico_escolar_coordenador.html";
        voltar.textContent = "Voltar à consulta";
        estado.querySelector(".estado-conteudo")?.append(voltar);
      }
    }
    return;
  }

  const ras = [...new Set(parametros.getAll("ra").filter(Boolean))];
  try {
    if (!ras.length) throw new Error("Não foi informado o RA do aluno para gerar o histórico.");
    const ano = parametros.get("ano");
    if (!window.html2pdf) throw new Error("A biblioteca de geração de PDF não foi carregada.");
    const documento = document.getElementById("historicos");
    documento.style.width = "210mm";
    documento.style.margin = "0";
    const options = {
      margin: 0,
      image: { type: "jpeg", quality: 0.88 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: "#ffffff" },
      jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
      pagebreak: { mode: [] }
    };
    let pdfDocument = null;
    let paginasProcessadas = 0;
    let paginasPDF = 0;
    const atualizarProgresso = (mensagem, progresso = null) => {
      if (mensagemEstado) mensagemEstado.textContent = mensagem;
      if (progresso !== null) {
        const percentual = Math.max(0, Math.min(100, progresso));
        const barra = document.getElementById("estadoProgressoBarra");
        const trilho = barra?.parentElement;
        if (barra) barra.style.width = `${percentual}%`;
        if (trilho) trilho.setAttribute("aria-valuenow", String(Math.round(percentual)));
      }
    };
    const aguardarLayout = () => new Promise(resolve =>
      requestAnimationFrame(() => requestAnimationFrame(resolve))
    );

    for (let inicio = 0; inicio < ras.length; inicio += 5) {
      const lote = ras.slice(inicio, inicio + 5);
      atualizarProgresso(`Carregando dados dos históricos ${inicio + 1} a ${inicio + lote.length} de ${ras.length}...`, paginasProcessadas / ras.length * 100);
      const alunos = await Promise.all(lote.map(ra => HistoricoEscolarDados.carregar(ra, ano)));

      for (let indice = 0; indice < alunos.length; indice++) {
        HistoricoEscolar.render([alunos[indice]], documento);
        await aguardarLayout();
        ajustarPaginasAoA4(documento);
        const paginas = [...documento.querySelectorAll(".pagina")];
        if (paginas.length !== 2) {
          throw new Error(`O histórico de ${ras[inicio + indice]} não gerou as duas páginas esperadas.`);
        }

        for (const pagina of paginas) {
          const worker = window.html2pdf().set(options).from(pagina).toCanvas();
          const canvas = await worker.get("canvas");
          if (Math.abs(canvas.width / canvas.height - 210 / 297) > 0.005) {
            throw new Error(`A página ${paginasPDF + 1} não corresponde às dimensões A4.`);
          }
          if (!pdfDocument) {
            pdfDocument = await worker.toPdf().get("pdf");
            if (pdfDocument.internal.getNumberOfPages() !== 1) {
              throw new Error("A primeira página do histórico excedeu o tamanho A4.");
            }
          } else {
            pdfDocument.addPage("a4", "portrait");
            pdfDocument.addImage(canvas.toDataURL("image/jpeg", options.image.quality), "JPEG", 0, 0, 210, 297);
          }
          paginasPDF++;
          canvas.width = 0;
          canvas.height = 0;
        }

        paginasProcessadas++;
        atualizarProgresso(`Preparando histórico ${paginasProcessadas} de ${ras.length}...`, paginasProcessadas / ras.length * 100);
        documento.replaceChildren();
        await new Promise(resolve => setTimeout(resolve, 0));
      }
    }

    if (!pdfDocument) throw new Error("Nenhuma página foi gerada para o PDF.");
    if (pdfDocument.internal.getNumberOfPages() !== ras.length * 2) {
      throw new Error(`O PDF gerou ${pdfDocument.internal.getNumberOfPages()} páginas; eram esperadas ${ras.length * 2}.`);
    }
    const raArquivo = ras[0].replace(/[^\w.-]+/g, "_");
    const nomeArquivo = ras.length > 1
      ? `historicos-escolares-${ano || "lote"}.pdf`
      : `historico-escolar-${raArquivo}.pdf`;
    pdfDocument.setProperties({ title: nomeArquivo });
    const pdf = pdfDocument.output("blob");
    const waitToken = parametros.get("waitToken");
    if (!waitToken) throw new Error("Não foi informado o identificador da aba de resultado.");
    await salvarPdfTemporario(waitToken, pdf, nomeArquivo);
    localStorage.setItem(`historico-pdf:${waitToken}`, JSON.stringify({ status: "ready" }));
    window.location.replace("historico_escolar_coordenador.html");
  } catch (erro) {
    console.error("Erro ao carregar histórico escolar:", erro);
    const waitToken = parametros.get("waitToken");
    if (waitToken) {
      try {
        localStorage.setItem(`historico-pdf:${waitToken}`, JSON.stringify({
          status: "error",
          message: erro.message
        }));
      } catch (erroArmazenamento) {
        console.error("Não foi possível notificar a aba de resultado:", erroArmazenamento);
      }
    }
    if (estado) {
      estado.classList.add("estado-erro");
      if (mensagemEstado) mensagemEstado.textContent = `Não foi possível gerar o histórico: ${erro.message}`;
      const voltar = document.createElement("a");
      voltar.className = "estado-voltar";
      voltar.href = "historico_escolar_coordenador.html";
      voltar.textContent = "Voltar à consulta";
      estado.querySelector(".estado-conteudo")?.append(voltar);
    }
  }
}
window.HistoricoEscolarDados = HistoricoEscolarDados;
iniciarHistorico();
