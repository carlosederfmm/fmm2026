<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário de Provas | SME FMM</title>
    <script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="../../assets/js/constants.js"></script><script src="../../assets/js/supabase_client.js"></script><script src="../../sidebar.js"></script>
    <script>let editingCalId = null;
tailwind.config = { theme: { extend: { colors: { fmm: { dark: '#003c5b', blue: '#00638f', green: '#80a51b', lime: '#c8d400', bg: '#f8fafc' } } } } };</script>
    <style>body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow: hidden; }.custom-scrollbar::-webkit-scrollbar { width: 4px; }.custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }.animate-fade { animation: fadeIn 0.3s ease-out forwards; }@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }.serie-tag { font-size: 8px; font-weight: 800; background: #f1f5f9; color: #64748b; padding: 1px 6px; border-radius: 4px; text-transform: uppercase; border: 1px solid #e2e8f0; }</style>
</head>
<body class="flex h-screen w-screen overflow-hidden text-slate-700">
    <aside id="sidebar-container" class="w-72 flex-shrink-0 bg-fmm-dark text-white z-20 shadow-2xl"></aside>
    <main class="flex-1 flex flex-col min-w-0 bg-slate-50 overflow-hidden text-left">
        <header class="bg-white border-b border-slate-200 h-20 px-8 flex items-center justify-between shrink-0 z-10 shadow-sm"><div><h1 class="text-xl font-black text-fmm-dark uppercase tracking-tight">Calendário de Provas</h1><p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Cadastro e consulta das avaliações programadas</p></div><div class="flex items-center gap-2 text-xs font-bold text-fmm-blue bg-fmm-blue/5 px-4 py-2 rounded-xl"><i data-lucide="calendar-days" class="w-4 h-4"></i> Gestão acadêmica</div></header>
        <div class="flex-1 flex flex-col min-h-0"><div id="calendarModal" class="flex-1 flex flex-col min-h-0 text-left">
        <div class="bg-white w-full h-full overflow-hidden flex flex-col text-left">
            <div class="flex flex-1 overflow-hidden">
                <div class="w-80 bg-slate-50 p-6 border-r border-slate-100 overflow-y-auto custom-scrollbar text-left">
                    <h3 class="text-[10px] font-black text-fmm-blue uppercase tracking-[0.2em] mb-6" id="calEntryTitle">Novo Registro</h3>
                    <div class="space-y-5 text-left">
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1 block mb-1">Segmento</label>
                            <select id="calMatriz" onchange="updateCalEtapa()" class="w-full p-3 bg-white border border-slate-200 rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-fmm-blue text-slate-600">
                                <option value="Fundamental">Fundamental</option>
                                <option value="Básica">Médio (Básica)</option>
                                <option value="Técnica">Médio (Técnico)</option>
                            </select>
                        </div>
                        <div class="p-4 bg-white border border-slate-200 rounded-2xl space-y-3 text-left">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2 text-left">Aplicar às Séries:</label>
                            <div id="seriesContainer" class="grid grid-cols-1 gap-2 text-left"></div>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1 block mb-1">Período Referência</label>
                            <select id="calEtapa" class="w-full p-3 bg-white border border-slate-200 rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-fmm-blue text-slate-600"></select>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1 block mb-1">Disciplina</label>
                            <select id="calDisc" class="w-full p-3 bg-white border border-slate-200 rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-fmm-blue text-slate-600"></select>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1 block mb-1">Tipo de Prova</label>
                            <select id="calTipo" class="w-full p-3 bg-white border border-slate-200 rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-fmm-blue text-slate-600">
                                <option value="P1">P1</option>
                                <option value="P2">P2</option>
                                <option value="REC">RC</option>
                                <option value="P1 - 2ª CHAMADA">P1 - 2ª CHAMADA</option>
                                <option value="P2 - 2ª CHAMADA">P2 - 2ª CHAMADA</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1 block mb-1">Data de Realização</label>
                            <input type="date" id="calDate" class="w-full p-3 bg-white border border-slate-200 rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-fmm-blue text-slate-600">
                        </div>
                        <div class="flex gap-2">
                            <button id="btnCancelEditCal" onclick="resetCalForm()" class="hidden flex-1 py-4 bg-slate-200 text-slate-600 text-xs font-black uppercase rounded-2xl active:scale-95 transition-all">Cancelar</button>
                            <button onclick="addExamRef()" id="btnSaveCal" class="flex-[2] py-4 bg-fmm-blue text-white text-xs font-black uppercase rounded-2xl shadow-lg hover:bg-fmm-dark transition-all transform active:scale-95">Salvar Registro</button>
                        </div>
                    </div>
                </div>
                
                <div class="flex-1 p-8 bg-white flex flex-col overflow-hidden text-left border-slate-100 border">
                    <div class="flex justify-between items-center mb-6 text-left">
                        <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest text-left">Filtros de Pesquisa</h3>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-6 text-left">
                        <select id="calFilterMatriz" onchange="renderCalendar()" class="p-2.5 px-4 bg-slate-50 border border-slate-100 rounded-xl text-[10px] font-bold outline-none focus:ring-2 focus:ring-fmm-blue uppercase text-slate-600">
                            <option value="all">Todas Matrizes</option>
                            <option value="Fundamental">Fundamental</option>
                            <option value="Básica">Básica</option>
                            <option value="Técnica">Técnica</option>
                        </select>
                        <select id="calFilterSerie" onchange="renderCalendar()" class="p-2.5 px-4 bg-slate-50 border border-slate-100 rounded-xl text-[10px] font-bold outline-none focus:ring-2 focus:ring-fmm-blue uppercase text-slate-600">
                            <option value="all">Todas Séries</option>
                            <option value="5º Ano">5º Ano</option>
                            <option value="6º Ano">6º Ano</option>
                            <option value="7º Ano">7º Ano</option>
                            <option value="8º Ano">8º Ano</option>
                            <option value="9º Ano">9º Ano</option>
                            <option value="1ª Série">1ª Série</option>
                            <option value="2ª Série">2ª Série</option>
                            <option value="3ª Série">3ª Série</option>
                        </select>
                        <input type="date" id="calFilterDate" onchange="renderCalendar()" class="p-2.5 px-4 bg-slate-50 border border-slate-100 rounded-xl text-[10px] font-bold outline-none focus:ring-2 focus:ring-fmm-blue text-slate-600">
                        <div class="relative group">
                            <i data-lucide="search" class="absolute left-3 top-2.5 w-3.5 h-3.5 text-slate-400 group-focus-within:text-fmm-blue transition-colors"></i>
                            <input type="text" id="calSearch" onkeyup="renderCalendar()" placeholder="Buscar disciplina..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-100 rounded-xl text-[10px] font-bold outline-none transition-all text-slate-600">
                        </div>
                    </div>
                    <div class="flex-1 overflow-y-auto custom-scrollbar border border-slate-100 rounded-3xl text-left">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-slate-50 sticky top-0 z-10 text-[9px] font-black text-slate-400 uppercase tracking-widest border-b">
                                <tr>
                                    <th class="p-4 text-center"><button type="button" onclick="sortCalendar('date')" class="w-full flex items-center justify-center gap-1 hover:text-fmm-blue transition-colors">Data <span id="sortIcon-date"></span></button></th>
                                    <th class="p-4"><button type="button" onclick="sortCalendar('discipline')" class="flex items-center gap-1 hover:text-fmm-blue transition-colors">Disciplina <span id="sortIcon-discipline"></span></button></th>
                                    <th class="p-4"><button type="button" onclick="sortCalendar('matrix')" class="flex items-center gap-1 hover:text-fmm-blue transition-colors">Matriz / Período <span id="sortIcon-matrix"></span></button></th>
                                    <th class="p-4 text-left"><button type="button" onclick="sortCalendar('series')" class="flex items-center gap-1 hover:text-fmm-blue transition-colors">Séries <span id="sortIcon-series"></span></button></th>
                                    <th class="p-4 text-center"><button type="button" onclick="sortCalendar('type')" class="w-full flex items-center justify-center gap-1 hover:text-fmm-blue transition-colors">Tipo <span id="sortIcon-type"></span></button></th>
                                    <th class="p-4 text-right">Ação</th>
                                </tr>
                            </thead>
                            <tbody id="calTableBody" class="divide-y divide-slate-50 text-xs font-bold text-slate-600"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
    </main>
    <script>let calendarData = [];
        let calendarSort = { key: 'date', direction: 'desc' };
        async function loadDisciplinas() {
            const { data, error } = await window.supabaseClient.from('disciplinas').select('sigla, nome').order('nome');
            if (error) throw new Error('Não foi possível carregar as disciplinas: ' + error.message);
            document.getElementById('calDisc').innerHTML = (data || []).map(d => `<option value="${d.sigla}">${d.nome}</option>`).join('');
        }
        function closeCalendarModal() {}
        async function init() {
            if(window.SidebarComponent) await SidebarComponent.render('sidebar-container');
            const { data: { user } } = await window.supabaseClient.auth.getUser();
            if (!user) return window.location.href = '../../index.html';

            const { data: profile } = await window.supabaseClient.from('perfis').select('cargo, niveis_acesso').eq('id', user.id).single();
            if (profile) {
                userLevels = (profile.cargo === 'diretor' || profile.cargo === 'coordenador') 
                    ? (profile.niveis_acesso && profile.niveis_acesso.length > 0 ? profile.niveis_acesso : []) 
                    : [];
            }

            lucide.createIcons();
            await loadDisciplinas();
            await loadRequests();
            updateCalEtapa();
        }

        function getDriveDirect(url) {
            return window.formatStudentPhotoUrl(url);
        }

        async function loadDisciplinas() {
            const { data } = await window.supabaseClient.from('disciplinas').select('sigla, nome').order('nome');
            if(data) document.getElementById('calDisc').innerHTML = data.map(d => `<option value="${d.sigla}">${d.nome}</option>`).join('');
        }

        async function loadRequests() {
            const statusFilter = document.getElementById('filterStatus').value;
            let query = window.supabaseClient.from('justificativas_ausencia').select(`*, alunos!inner(nome_completo, url_foto, turmas!inner(nome, nivel, serie))`).order('criado_em', { ascending: false });
            if (statusFilter !== 'all') query = query.eq('status', statusFilter);
            if (userLevels.length > 0) query = query.in('nivel_aluno', userLevels);

            const { data, error } = await query;
            if (error) return console.error(error);

            allRequests = data.map(req => ({
                ...req, 
                provas_solicitadas: Array.isArray(req.provas_solicitadas) ? req.provas_solicitadas.map(p => ({ ...p, status: p.status || 'Pendente' })) : []
            }));

            const map = {};
            allRequests.forEach(req => {
                if (!map[req.aluno_ra]) {
                    map[req.aluno_ra] = { aluno: req.alunos, ra: req.aluno_ra, requests: [], pending: 0, approved: 0, rejected: 0 };
                }
                map[req.aluno_ra].requests.push(req);
                if (req.provas_solicitadas.length > 0) {
                    if (req.status === 'Pendente') map[req.aluno_ra].pending++;
                    else if (req.status === 'Deferido') map[req.aluno_ra].approved++;
                    else if (req.status === 'Indeferido') map[req.aluno_ra].rejected++;
                }
            });

            studentsAgrupados = Object.values(map).sort((a, b) => (b.pending > 0 ? 1 : 0) - (a.pending > 0 ? 1 : 0) || a.aluno.nome_completo.localeCompare(b.aluno.nome_completo));
            
            renderList();
            if (selectedRA) showStudent(selectedRA);
            
            await loadCalendar();
            if (currentView === 'exam') renderExamCards();
        }

        function renderList() {
            const list = document.getElementById('requestListAgrupada');
            const search = document.getElementById('searchBox').value.toLowerCase();
            const filtered = studentsAgrupados.filter(s => s.aluno.nome_completo.toLowerCase().includes(search) || s.ra.includes(search));
            if (filtered.length === 0) { list.innerHTML = '<div class="p-8 text-center text-slate-400 text-xs font-bold uppercase tracking-widest">Nenhum aluno.</div>'; return; }
            list.innerHTML = filtered.map(s => `
                <div onclick="showStudent('${s.ra}')" id="card-${s.ra}" class="request-card p-5 border-b border-slate-50 cursor-pointer hover:bg-slate-50 transition-all text-left">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[8px] font-black uppercase bg-slate-50 px-2 py-0.5 rounded tracking-tighter border border-slate-100">
                            ${s.requests.length} PROCESSOS ${s.pending > 0 ? `| <span class="text-red-600">${s.pending} PENDENTE</span>` : ''}
                        </span>
                        <span class="text-[9px] font-black text-slate-300 uppercase text-right">${s.aluno.turmas?.nome || 'FMM'}</span>
                    </div>
                    <h4 class="text-xs font-black text-fmm-dark uppercase leading-tight truncate text-left">${s.aluno.nome_completo}</h4>
                    <p class="text-[10px] text-slate-400 font-bold mt-1 uppercase truncate text-left">RA: ${s.ra}</p>
                </div>`).join('');
        }

        function filterList() { renderList(); }

        async function showStudent(ra) {
            const data = studentsAgrupados.find(s => s.ra === ra);
            if(!data) return;
            selectedRA = ra;
            document.querySelectorAll('.request-card').forEach(c => c.classList.remove('active'));
            const activeCard = document.getElementById(`card-${ra}`);
            if(activeCard) activeCard.classList.add('active');
            document.getElementById('emptyStateStudent').classList.add('hidden');
            document.getElementById('studentDetail').classList.remove('hidden');
            document.getElementById('detName').innerText = data.aluno.nome_completo;
            document.getElementById('detRA').innerText = data.ra;
            document.getElementById('detTurma').innerText = data.aluno.turmas?.nome || 'FMM';
            document.getElementById('detProcessCount').innerText = data.requests.length;
            const avatarImg = getDriveDirect(data.aluno.url_foto);
            document.getElementById('detAvatar').innerHTML = avatarImg ? `<img src="${avatarImg}" class="w-full h-full object-cover" onclick="openPhotoZoom(this.src, '${data.aluno.nome_completo.replace(/'/g, "")}')">` : '🎓';

            const abonos = data.requests.filter(r => r.provas_solicitadas.length === 0);
            const segundas = data.requests.filter(r => r.provas_solicitadas.length > 0);

            document.getElementById('listAbonos').innerHTML = abonos.length > 0 
                ? abonos.map(r => `
                    <div onclick='openEditModal(${JSON.stringify(r)})' class="process-item p-4 bg-white rounded-2xl shadow-sm space-y-2 border-l-4 border-l-slate-200 animate-fade text-left">
                        <div class="flex justify-between items-center text-left">
                            <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest text-left">${r.tipo_documento.replace('MEDICO', 'ATESTADO')}</span>
                            <span class="text-[9px] font-black text-slate-300 uppercase text-right">${new Date(r.criado_em).toLocaleDateString('pt-BR')}</span>
                        </div>
                        <p class="text-[11px] font-bold text-fmm-dark uppercase leading-tight text-left">${new Date(r.data_inicio + 'T12:00:00').toLocaleDateString('pt-BR')} (${r.quantidade_dias} dias)</p>
                    </div>`).join('')
                : '<div class="p-6 text-center bg-slate-50/50 rounded-2xl border border-dashed border-slate-200 text-[10px] font-bold text-slate-300 uppercase text-center">Nenhum abono.</div>';

            document.getElementById('listSegundas').innerHTML = segundas.length > 0
                ? segundas.map(r => {
                    const statusClasses = { 'Pendente': 'status-pending', 'Deferido': 'status-approved', 'Indeferido': 'status-rejected' };
                    return `
                    <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden animate-fade text-left">
                        <div onclick='openEditModal(${JSON.stringify(r)})' class="p-6 bg-slate-50/30 cursor-pointer hover:bg-slate-50 transition-all text-left">
                            <div class="flex justify-between items-start text-left">
                                <div class="text-left">
                                    <span class="status-badge ${statusClasses[r.status]} text-left">${r.status}</span>
                                    <h4 class="text-xs font-black text-fmm-dark uppercase mt-2 text-left">${r.tipo_documento.replace('MEDICO', 'ATESTADO')}</h4>
                                    <p class="text-[10px] text-slate-400 font-bold uppercase text-left">${new Date(r.data_inicio + 'T12:00:00').toLocaleDateString('pt-BR')} — ${r.quantidade_dias} dias</p>
                                </div>
                                <span class="text-[9px] font-black text-slate-300 uppercase text-right">${new Date(r.criado_em).toLocaleDateString('pt-BR')}</span>
                            </div>
                        </div>
                        <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-3 border-t border-slate-100 text-left">
                            ${r.provas_solicitadas.map((p, idx) => `
                                <div class="flex justify-between items-center p-3 bg-slate-50 border border-slate-100 rounded-xl text-left">
                                    <div class="flex flex-col text-left">
                                        <span class="text-[10px] font-black text-fmm-blue uppercase leading-tight text-left">${p.disciplina}</span>
                                        <span class="text-[8px] font-bold text-slate-400 uppercase tracking-tighter text-left">${p.data}</span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="status-badge ${statusClasses[p.status]}">${p.status}</span>
                                        <div class="flex border-l border-slate-200 ml-1 pl-1">
                                            <button onclick="updateExamStatus('${r.id}', ${idx}, 'Indeferido')" class="p-1 hover:bg-red-50 text-slate-300 hover:text-red-500 transition-all"><i data-lucide="x" class="w-4 h-4"></i></button>
                                            <button onclick="updateExamStatus('${r.id}', ${idx}, 'Deferido')" class="p-1 hover:bg-green-50 text-slate-300 hover:text-fmm-green transition-all"><i data-lucide="check" class="w-4 h-4"></i></button>
                                        </div>
                                    </div>
                                </div>`).join('')}
                        </div>
                    </div>`;
                }).join('')
                : '<div class="p-10 text-center bg-slate-50/50 rounded-2xl border border-dashed border-slate-200 text-[10px] font-bold text-slate-300 uppercase text-center">Nenhuma solicitação de prova.</div>';
            lucide.createIcons();
        }

        function renderExamCards() {
            const grid = document.getElementById('examCardsGrid');
            grid.innerHTML = '';
            
            const examStats = calendarData.map(exam => {
                const requestsForExam = [];
                allRequests.forEach(req => {
                    req.provas_solicitadas.forEach((p, idx) => {
                        if (p.id_calendario === exam.id) {
                            requestsForExam.push({ ...p, reqId: req.id, aluno: req.alunos, ra: req.aluno_ra, anexo: req.anexo_url, examIndex: idx });
                        }
                    });
                });

                if (requestsForExam.length === 0) return null;

                return {
                    ...exam,
                    requests: requestsForExam,
                    pending: requestsForExam.filter(r => r.status === 'Pendente').length,
                    approved: requestsForExam.filter(r => r.status === 'Deferido').length,
                    rejected: requestsForExam.filter(r => r.status === 'Indeferido').length
                };
            }).filter(e => e !== null);

            if (examStats.length === 0) {
                document.getElementById('emptyStateExams').classList.remove('hidden');
                return;
            }
            document.getElementById('emptyStateExams').classList.add('hidden');

            examStats.sort((a,b) => b.pending - a.pending);

            grid.innerHTML = examStats.map(exam => `
                <div onclick='openExamDetailModal(${JSON.stringify(exam).replace(/'/g, "&apos;")})' class="exam-card bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm flex flex-col gap-5 text-left">
                    <div class="flex justify-between items-start text-left">
                        <div class="flex items-center gap-3 text-left">
                            <div class="p-3 bg-fmm-blue/10 rounded-2xl text-fmm-blue shrink-0"><i data-lucide="clipboard-list" class="w-6 h-6"></i></div>
                            <div>
                                <span class="text-[9px] font-black text-fmm-blue uppercase tracking-widest bg-fmm-blue/5 px-2 py-0.5 rounded border border-fmm-blue/10">${exam.matriz}</span>
                                <p class="text-[8px] font-bold text-slate-400 uppercase tracking-widest mt-1">${exam.periodo_ref.replace('_', ' ')}</p>
                            </div>
                        </div>
                        <div class="text-right shrink-0"><span class="text-[9px] font-black text-slate-300 uppercase text-right">${new Date(exam.data_prova + 'T12:00:00').toLocaleDateString('pt-BR')}</span></div>
                    </div>
                    <div>
                        <h4 class="text-base font-black text-fmm-dark uppercase tracking-tight leading-tight text-left">${exam.disciplinas?.nome || exam.sigla_disciplina}</h4>
                        <div class="flex flex-wrap gap-1 mt-2 text-left">
                            <span class="serie-tag bg-fmm-dark text-white border-none">${exam.tipo_prova}</span>
                            ${(exam.series || []).map(s => `<span class="serie-tag text-left">${s}</span>`).join('')}
                        </div>
                    </div>
                    <div class="pt-4 border-t border-slate-50 flex justify-between items-center text-left">
                        <div class="flex gap-4 text-left">
                            <div class="flex flex-col text-left"><span class="text-[18px] font-black text-red-500 leading-none text-left">${exam.pending}</span><span class="text-[8px] font-bold text-slate-400 uppercase tracking-widest mt-1 text-left">Pendentes</span></div>
                            <div class="flex flex-col text-left"><span class="text-[18px] font-black text-green-500 leading-none text-left">${exam.approved}</span><span class="text-[8px] font-bold text-slate-400 uppercase tracking-widest mt-1 text-left">Aprovadas</span></div>
                        </div>
                        <i data-lucide="chevron-right" class="w-5 h-5 text-slate-300"></i>
                    </div>
                </div>`).join('');
            lucide.createIcons();
        }

        function openExamDetailModal(exam) {
            currentExamOpen = exam;
            const modal = document.getElementById('examDetailModal');
            document.getElementById('examModalTitle').innerText = `${exam.disciplinas?.nome || exam.sigla_disciplina} - ${exam.tipo_prova}`;

                            <button onclick="updateExamStatus('${r.reqId}', ${r.examIndex}, 'Deferido')" class="w-9 h-9 bg-green-50 hover:bg-fmm-green text-fmm-green hover:text-white rounded-xl transition-all flex items-center justify-center shadow-sm"><i data-lucide="check" class="w-4 h-4"></i></button>

            modal.classList.remove('hidden');
            lucide.createIcons();

        function openSummaryModal() {
            const body = document.getElementById('summaryTableBody');
            body.innerHTML = '';
            const summary = {}; 

            allRequests.forEach(req => {
                const studentSerie = req.alunos?.turmas?.serie || 'Sem Série';
                req.provas_solicitadas.forEach(prova => {
                    if (prova.status === 'Deferido') {
                        const disc = prova.disciplina;
                        if (!summary[disc]) summary[disc] = {};
                        if (!summary[disc][studentSerie]) summary[disc][studentSerie] = 0;
                        summary[disc][studentSerie]++;
                    }
                });
            });

            const sortedDiscs = Object.keys(summary).sort();
            let rowsHtml = '';

            sortedDiscs.forEach(disc => {
                const series = summary[disc];
                const sortedSeries = Object.keys(series).sort();
                sortedSeries.forEach((serie, index) => {
                    rowsHtml += `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="p-6 font-black text-fmm-dark">${index === 0 ? disc : ''}</td>
                            <td class="p-6 text-slate-500">${serie}</td>
                            <td class="p-6 text-center">
                                <span class="px-4 py-1.5 bg-fmm-blue/10 text-fmm-blue rounded-lg font-black text-sm">
                                    ${series[serie]}
                                </span>
                            </td>
                        </tr>`;
                });
            });

            if (rowsHtml === '') body.innerHTML = '<tr><td colspan="3" class="p-12 text-center text-slate-300 italic">Nenhuma inscrição deferida até o momento.</td></tr>';
            else body.innerHTML = rowsHtml;

            document.getElementById('summaryModal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeSummaryModal() { document.getElementById('summaryModal').classList.add('hidden'); }

        function printExamAttendanceList() {
            if (!currentExamOpen || !currentExamOpen.requests) return;
            
            const deferidos = currentExamOpen.requests
                .filter(r => r.status === 'Deferido')
                .sort((a, b) => a.aluno.nome_completo.localeCompare(b.aluno.nome_completo));
                
            if (deferidos.length === 0) return alert("Nenhum aluno com requerimento DEFERIDO para esta prova.");
        
            const printArea = document.getElementById('printArea');
            const nomeProva = currentExamOpen.disciplinas?.nome || currentExamOpen.sigla_disciplina;
            
            const ITEMS_PER_PAGE = 43;
            const totalPages = Math.ceil(deferidos.length / ITEMS_PER_PAGE);
            let html = '';
        
            for (let p = 0; p < totalPages; p++) {
                const pageStudents = deferidos.slice(p * ITEMS_PER_PAGE, (p + 1) * ITEMS_PER_PAGE);
                
                html += `<div class="print-page">`;
                
                // Cabeçalho repetido em cada página
                html += `
                    <div class="print-header">
                        <img src="../../assets/logo-fmm-color.png" alt="FMM Logo">
                        <div class="doc-title text-right">
                            <h1>Lista de Assinatura</h1>
                            <p>Segunda Chamada de Avaliação — Pág. ${p + 1}/${totalPages}</p>
                        </div>
                    </div>
                    <div class="print-info-grid">
                        <div class="info-box text-left">
                            <label>Prova / Componente Curricular</label>
                            <span>${nomeProva} - ${currentExamOpen.tipo_prova}</span>
                        </div>
                        <div class="info-box text-left">
                            <label>Data da Aplicação</label>
                            <span>____ / ____ / 2026</span>
                        </div>
                    </div>
                `;
                
                // Tabela da página atual
                html += `
                    <table class="print-table">
                        <thead>
                            <tr>
                                <th class="col-num">Nº</th>
                                <th class="col-ra">RA</th>
                                <th class="col-aluno">Estudante</th>
                                <th class="col-turma">Turma</th>
                                <th class="col-signature">Assinatura Inicial</th>
                                <th class="col-signature">Assinatura Final</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
        
                for (let i = 0; i < pageStudents.length; i++) {
                    const r = pageStudents[i];
                    const globalIndex = (p * ITEMS_PER_PAGE) + i + 1; // Mantém a contagem contínua entre páginas
                    
                    html += `
                        <tr>
                            <td class="col-num text-center">${globalIndex}</td>
                            <td class="col-ra text-center">${r.ra}</td>
                            <td class="col-aluno" title="${r.aluno.nome_completo}">${r.aluno.nome_completo}</td>
                            <td class="col-turma text-center">${r.aluno.turmas?.nome || ''}</td>
                            <td class="col-signature"></td>
                            <td class="col-signature"></td>
                        </tr>
                    `;
                }
        
                html += `
                        </tbody>
                    </table>
                    
                    <!-- Rodapé em todas as páginas -->
                    <div class="print-footer">
                        <div class="signature-line text-center">Assinatura do Aplicador</div>
                        <div class="signature-line text-center">Coordenação Pedagógica</div>
                    </div>
                </div>`;
            }
        
            printArea.innerHTML = html;
            
            setTimeout(() => { 
                window.print(); 
            }, 500);
        }

        function closeExamDetailModal() { document.getElementById('examDetailModal').classList.add('hidden'); currentExamOpen = null; }

        async function updateExamStatus(reqId, examIndex, newStatus) {
            const req = allRequests.find(r => r.id === reqId);
            if (!req) return;
        
            // 1. Atualização local imediata na memória (Interface responde na hora)
            const provas = [...req.provas_solicitadas];
            provas[examIndex].status = newStatus;
            
            let finalStatus = 'Pendente';
            if (provas.every(p => p.status === 'Deferido')) finalStatus = 'Deferido';
            if (provas.some(p => p.status === 'Indeferido')) finalStatus = 'Indeferido';
        
            req.provas_solicitadas = provas;
            req.status = finalStatus;
        
            // 2. Se o modal da prova estiver aberto, atualiza a tabela imediatamente
            if (currentExamOpen) {
                const updatedRequests = [];
                allRequests.forEach(r => {
                    r.provas_solicitadas.forEach((p, idx) => {
                        // Converte ambos para String para garantir a comparação exata do ID da prova
                        if (String(p.id_calendario) === String(currentExamOpen.id)) {
                            updatedRequests.push({ 
                                ...p, 
                                reqId: r.id, 
                                aluno: r.alunos, 
                                ra: r.aluno_ra, 
                                anexo: r.anexo_url, 
                                examIndex: idx 
                            });
                        }
                    });
                });
        
                currentExamOpen.requests = updatedRequests;
                openExamDetailModal(currentExamOpen);
            }
        
            // 3. Persiste no Banco de Dados em segundo plano
            await window.supabaseClient
                .from('justificativas_ausencia')
                .update({ status: finalStatus, provas_solicitadas: provas })
                .eq('id', reqId);
        
            // 4. Sincroniza a base global e os cards de fundo
            await loadRequests();
        }

            document.getElementById(`tab-${view}`).classList.add('active');
            document.getElementById('view-student-container').classList.toggle('hidden', view !== 'student');
            document.getElementById('view-exam-container').classList.toggle('hidden', view !== 'exam');
            if (view === 'exam') renderExamCards();
        }

        async function loadCalendar() { 
            let query = window.supabaseClient.from('calendario_referencia_provas').select('*, disciplinas(nome)').order('data_prova', { ascending: false });
            const { data } = await query; calendarData = data || []; 
            renderCalendar();
        }

            document.getElementById('editStart').value = request.data_inicio;

            const updated = { tipo_documento: document.getElementById('editDocType').value, data_inicio: document.getElementById('editStart').value, quantidade_dias: parseInt(document.getElementById('editDays').value), cid: document.getElementById('editExtra').value };

        function openCalendarModal() { resetCalForm(); document.getElementById('calendarModal').classList.remove('hidden'); renderCalendar(); }
        function closeCalendarModal() { document.getElementById('calendarModal').classList.add('hidden'); }
        function openPhotoZoom(src, name) { document.getElementById('zoomedImage').src = src; document.getElementById('zoomedName').innerText = name || "Aluno"; document.getElementById('photoZoomModal').classList.remove('hidden'); }
        function closePhotoZoom() { document.getElementById('photoZoomModal').classList.add('hidden'); }

        function updateCalEtapa(preSelected = null) {
            const matriz = document.getElementById('calMatriz').value;
            const etapa = document.getElementById('calEtapa');
            const seriesContainer = document.getElementById('seriesContainer');
            
            // TASK: Correção Semestre para Técnico
            if(matriz === 'Fundamental') etapa.innerHTML = `<option value="1_BIMESTRE">1º Bimestre</option><option value="2_BIMESTRE">2º Bimestre</option><option value="3_BIMESTRE">3º Bimestre</option><option value="4_BIMESTRE">4º Bimestre</option>`;
            else if(matriz === 'Técnica') etapa.innerHTML = `<option value="1_SEMESTRE">1º Semestre</option><option value="2_SEMESTRE">2º Semestre</option>`;
            else etapa.innerHTML = `<option value="1_TRIMESTRE">1º Trimestre</option><option value="2_TRIMESTRE">2º Trimestre</option><option value="3_TRIMESTRE">3º Trimestre</option>`;
            
            if(preSelected) etapa.value = preSelected;

            let options = matriz === 'Fundamental' ? ['5º Ano', '6º Ano', '7º Ano', '8º Ano', '9º Ano'] : ['1ª Série', '2ª Série', '3ª Série'];
            seriesContainer.innerHTML = options.map(s => `<label class="flex items-center gap-3 p-3 bg-white border border-slate-100 rounded-xl cursor-pointer hover:bg-slate-50 transition-all group text-left"><input type="checkbox" name="serie_checkbox" value="${s}" class="w-4 h-4 rounded border-slate-300 text-fmm-blue focus:ring-fmm-blue"><span class="text-[11px] font-bold text-slate-500 uppercase group-hover:text-fmm-dark text-left">${s}</span></label>`).join('');
        }

        async function addExamRef() {
            const data = document.getElementById('calDate').value;
            const selectedSeries = Array.from(document.querySelectorAll('input[name="serie_checkbox"]:checked')).map(cb => cb.value);
            if(!data || selectedSeries.length === 0) return alert("Preencha data e série.");

            const payload = { 
                matriz: document.getElementById('calMatriz').value, 
                periodo_ref: document.getElementById('calEtapa').value, 
                sigla_disciplina: document.getElementById('calDisc').value, 
                tipo_prova: document.getElementById('calTipo').value, 
                data_prova: data, 
                series: selectedSeries 
            };

            const btn = document.getElementById('btnSaveCal');
            btn.disabled = true; btn.innerText = "Sincronizando...";

            try {
                if (editingCalId) {
                    const { error } = await window.supabaseClient.from('calendario_referencia_provas').update(payload).eq('id', editingCalId);
                    if(error) throw error;
                } else {
                    const { error } = await window.supabaseClient.from('calendario_referencia_provas').insert([payload]);
                    if(error) throw error;
                }
                resetCalForm();
                await loadCalendar();
            } catch (err) {
                alert("Erro ao salvar: " + err.message);
            } finally {
                btn.disabled = false; btn.innerText = editingCalId ? "Atualizar Registro" : "Salvar no Calendário";
            }
        }

        // TASK: Lógica de Edição do Calendário
        function prepEditCal(c) {
            editingCalId = c.id;
            document.getElementById('calEntryTitle').innerText = "Editar Registro";
            document.getElementById('btnSaveCal').innerText = "Atualizar Registro";
            document.getElementById('btnCancelEditCal').classList.remove('hidden');
            
            document.getElementById('calMatriz').value = c.matriz;
            updateCalEtapa(c.periodo_ref);
            
            document.getElementById('calDisc').value = c.sigla_disciplina;
            document.getElementById('calTipo').value = c.tipo_prova;
            document.getElementById('calDate').value = c.data_prova;
            
            const checks = document.querySelectorAll('input[name="serie_checkbox"]');
            checks.forEach(cb => {
                cb.checked = (c.series || []).includes(cb.value);
            });
            lucide.createIcons();
        }

        function resetCalForm() {
            editingCalId = null;
            document.getElementById('calEntryTitle').innerText = "Novo Registro";
            document.getElementById('btnSaveCal').innerText = "Salvar no Calendário";
            document.getElementById('btnCancelEditCal').classList.add('hidden');
            document.getElementById('calMatriz').value = "Fundamental";
            updateCalEtapa();
            document.getElementById('calDate').value = "";
            document.getElementById('calTipo').value = "P1";
            lucide.createIcons();
        }

        async function deleteCal(id) { if(confirm("Remover do calendário?")) { await window.supabaseClient.from('calendario_referencia_provas').delete().eq('id', id); await loadCalendar(); } }

        function sortCalendar(key) {
            calendarSort = {
                key,
                direction: calendarSort.key === key && calendarSort.direction === 'asc' ? 'desc' : 'asc'
            };
            renderCalendar();
        }

        function getCalendarSortValue(item, key) {
            if (key === 'date') return item.data_prova || '';
            if (key === 'discipline') return item.disciplinas?.nome || item.sigla_disciplina || '';
            if (key === 'matrix') return `${item.matriz || ''} ${item.periodo_ref || ''}`;
            if (key === 'series') return (item.series || []).join(', ');
            return item.tipo_prova || '';
        }

        function updateCalendarSortIcons() {
            ['date', 'discipline', 'matrix', 'series', 'type'].forEach(key => {
                const icon = document.getElementById(`sortIcon-${key}`);
                if (!icon) return;
                icon.innerHTML = key === calendarSort.key
                    ? `<i data-lucide="${calendarSort.direction === 'asc' ? 'arrow-up' : 'arrow-down'}" class="w-3 h-3"></i>`
                    : '<i data-lucide="chevrons-up-down" class="w-3 h-3 opacity-40"></i>';
            });
        }

        function renderCalendar() {
            const body = document.getElementById('calTableBody');
            const fMatriz = document.getElementById('calFilterMatriz').value;
            const fSerie = document.getElementById('calFilterSerie').value;
            const fDate = document.getElementById('calFilterDate').value;
            const term = document.getElementById('calSearch').value.toLowerCase();
            
            // TASK: Sistema de Filtros Avançados
            const filtered = calendarData.filter(c => {
                const matchMatriz = fMatriz === 'all' || c.matriz === fMatriz;
                const matchSerie = fSerie === 'all' || (c.series || []).includes(fSerie);
                const matchDate = fDate ? c.data_prova === fDate : true;
                const discName = (c.disciplinas?.nome || c.sigla_disciplina).toLowerCase();
                const matchSearch = discName.includes(term) || c.sigla_disciplina.toLowerCase().includes(term);
                
                return matchMatriz && matchSerie && matchDate && matchSearch;
            });

            filtered.sort((a, b) => {
                const first = getCalendarSortValue(a, calendarSort.key).toLocaleLowerCase('pt-BR');
                const second = getCalendarSortValue(b, calendarSort.key).toLocaleLowerCase('pt-BR');
                const result = first.localeCompare(second, 'pt-BR', { numeric: true, sensitivity: 'base' });
                return calendarSort.direction === 'asc' ? result : -result;
            });

            body.innerHTML = filtered.map(c => `
                <tr class="hover:bg-slate-50 transition-colors text-left text-xs font-bold text-slate-600">
                    <td class="p-4 text-center">${new Date(c.data_prova + 'T12:00:00').toLocaleDateString('pt-BR')}</td>
                    <td class="p-4 uppercase text-fmm-blue text-left">${c.disciplinas?.nome || c.sigla_disciplina}</td>
                    <td class="p-4 uppercase text-left">
                        <span class="text-[9px] font-black text-slate-400 bg-slate-100 px-2 py-0.5 rounded border border-slate-200 tracking-widest">${c.matriz}</span>
                        <p class="mt-1 text-slate-400 uppercase text-[9px] tracking-tight text-left">${c.periodo_ref.replace('_', ' ')}</p>
                    </td>
                    <td class="p-4 text-left"><div class="flex flex-wrap gap-1 text-left">${(c.series || []).map(s => `<span class="serie-tag">${s}</span>`).join('')}</div></td>
                    <td class="p-4 text-center"><span class="bg-fmm-blue text-white px-2 py-0.5 rounded text-[9px] font-black uppercase tracking-widest shadow-sm">${c.tipo_prova}</span></td>
                    <td class="p-4 text-right">
                        <div class="flex justify-end gap-2">
                            <button onclick='prepEditCal(${JSON.stringify(c)})' class="text-slate-400 hover:text-fmm-blue p-2"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                            <button onclick="deleteCal('${c.id}')" class="text-slate-200 hover:text-red-500 p-2"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </td>
                </tr>`).join('');
            updateCalendarSortIcons();
            lucide.createIcons();
        }

        
        async function init() { if (window.SidebarComponent) await SidebarComponent.render('sidebar-container'); const { data: { user } } = await window.supabaseClient.auth.getUser(); if (!user) return window.location.href = '../../index.html'; lucide.createIcons(); await loadDisciplinas(); await loadCalendar(); resetCalForm(); }
        window.onload = init;
    </script>
